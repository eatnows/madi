[package]
name = "madi-syntax"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Real syntax-tree-based highlighting and symbol extraction for Madi, via bundled tree-sitter grammars (no plugin download, no WASM runtime)"

[dependencies]
streaming-iterator = "0.1"
tree-sitter = "0.24"
tree-sitter-json = "0.24"
tree-sitter-md = "0.3"
tree-sitter-rust = "0.23"
tree-sitter-toml-ng = "0.7"
