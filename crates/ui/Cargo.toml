[package]
name = "maditor-ui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "maditor"
path = "src/main.rs"

[dependencies]
gpui = "0.2.2"
maditor-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
chrono = "0.4"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
