[package]
name = "madi"
version = "0.1.0"
edition = "2021"
description = "Madi, a native Rust code editor built on the gyeol UI toolkit"

[[bin]]
name = "madi"
path = "src/main.rs"

[dependencies]
gyeol = { path = "../../../gyeol" }
madi-project = { path = "../project" }
madi-text = { path = "../text" }
madi-git = { path = "../git" }
madi-plugins = { path = "../plugins" }

[dev-dependencies]
sha2 = "0.10"
