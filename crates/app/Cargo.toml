[package]
name = "madi"
version = "0.1.6"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Madi, a native Rust code editor built on the gyeol UI toolkit"

[[bin]]
name = "madi"
path = "src/main.rs"

[dependencies]
gyeol = { git = "https://github.com/eatnows/gyeol", tag = "v0.1.0" }
madi-project = { path = "../project" }
madi-text = { path = "../text" }
madi-git = { path = "../git" }
madi-plugins = { path = "../plugins" }
madi-syntax = { path = "../syntax" }
pulldown-cmark = { version = "0.12", default-features = false }

[dev-dependencies]
sha2 = "0.10"
