[package]
name = "madi-plugins"
version = "0.1.0"
edition = "2021"
description = "Installing language plugins for Madi: downloaded, checksum-verified regex-based highlight and symbol rules"

[dependencies]
madi-project = { path = "../project" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["rustls"] }
